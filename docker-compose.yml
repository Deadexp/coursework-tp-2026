services:
  db:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: [./backend:/app]
    depends_on:
      db: { condition: service_healthy }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  bot:
    build: ./bot
    env_file: .env
    volumes: [./bot:/app]
    depends_on: [api]

  web:
    image: node:20
    working_dir: /app
    environment: { API_PROXY_TARGET: "http://api:8000" }
    # node_modules у контейнера свои: в Linux и macOS разные бинарные пакеты
    volumes: [./frontend:/app, /app/node_modules]
    ports: ["5173:5173"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on: [api]

volumes:
  pgdata:
